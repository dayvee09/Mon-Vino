# Local Apache for Mon Vino development:
#   /           → short landing page (links to /monvino/)
#   /monvino/   → Mon Vino React (CRA on :3000)
#   /api-php/   → Mon Vino PHP API
#
# Keep the legacy school path so older clients still work.

<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /workspaces/alpinecraft/.devcontainer/www

    <Directory /workspaces/alpinecraft/.devcontainer/www>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Production-like API path
    Alias /api-php /workspaces/alpinecraft/apps/monvino/api-php
    # Legacy path expected by older React defaults
    Alias /PW2/cellier-projet/api-php /workspaces/alpinecraft/apps/monvino/api-php

    <Directory /workspaces/alpinecraft/apps/monvino/api-php>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource disabled
    </Directory>

    # CRA HMR websocket (sockPath is /ws at host root, not under /monvino)
    ProxyPass /ws ws://127.0.0.1:3000/ws retry=0
    ProxyPassReverse /ws ws://127.0.0.1:3000/ws

    # Nested Mon Vino → webpack-dev-server (npm start). homepage/basename = /monvino
    ProxyPass /monvino/ http://127.0.0.1:3000/monvino/ retry=0
    ProxyPassReverse /monvino/ http://127.0.0.1:3000/monvino/
    RedirectMatch ^/monvino$ /monvino/

    # Static build fallback when CRA is not running (optional local prod preview)
    Alias /monvino-static /workspaces/alpinecraft/apps/monvino/client/build
    <Directory /workspaces/alpinecraft/apps/monvino/client/build>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /monvino-static/index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/monvino-error.log
    CustomLog ${APACHE_LOG_DIR}/monvino-access.log combined
</VirtualHost>
