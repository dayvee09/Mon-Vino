<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 12 96 268" role="img" aria-label="Bouteille Mon Vino">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1728"/>
      <stop offset="35%" stop-color="#1a2d4d"/>
      <stop offset="70%" stop-color="#152440"/>
      <stop offset="100%" stop-color="#0b1322"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6c57a"/>
      <stop offset="100%" stop-color="#e09a3a"/>
    </linearGradient>
  </defs>
  <!-- shoulders + body -->
  <path fill="url(#glass)" d="
    M88 78
    C88 90 78 104 70 116
    C62 128 58 140 58 154
    V250
    C58 266 74 276 100 276
    S142 266 142 250
    V154
    C142 140 138 128 130 116
    C122 104 112 90 112 78
    Z"/>
  <!-- neck overlaps body top -->
  <rect x="88" y="28" width="24" height="54" rx="3" fill="url(#glass)"/>
  <!-- foil capsule -->
  <rect x="86" y="18" width="28" height="22" rx="5" fill="url(#foil)"/>
  <rect x="90" y="14" width="20" height="8" rx="3" fill="#f1ab50"/>
  <!-- soft vertical highlight -->
  <path fill="#f3f5eb" opacity="0.1" d="
    M80 130
    C80 118 82 108 84 100
    C85 96 86 92 86 88
    H90
    C90 94 89 100 88 106
    C86 116 84 124 84 136
    V230
    H80
    Z"/>
  <!-- cream label -->
  <rect x="68" y="168" width="64" height="78" rx="4" fill="#f3f5eb"/>
  <rect x="71" y="171" width="58" height="72" rx="3" fill="none" stroke="#d8c9a8" stroke-width="1"/>
  <!-- Mon Vino wordmark -->
  <g transform="translate(100 206)" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="-16.5" y="-11" font-size="7.5" letter-spacing="1.1" fill="#152440">MON</text>
    <text x="-20.5" y="12" font-size="13.5" fill="#152440">V</text>
    <g transform="translate(-5 0)" fill="#f1ab50">
      <rect x="-2" y="-8" width="4" height="2.6" rx="0.65"/>
      <rect x="-1.1" y="-5.4" width="2.2" height="4.2" rx="0.25"/>
      <path d="M-1.1-1.2
               C-3.1 0.8 -4 3.1 -4 5.4
               V14
               C-4 15.4 -2.4 16.4 0 16.4
               S4 15.4 4 14
               V5.4
               C4 3.1 3.1 0.8 1.1-1.2
               Z"/>
    </g>
    <text x="1.5" y="12" font-size="13.5" letter-spacing="0.1" fill="#152440">NO</text>
  </g>
  <rect x="84" y="228" width="32" height="2" rx="1" fill="#cc4240" opacity="0.8"/>
  <rect x="88" y="235" width="24" height="2" rx="1" fill="#152440" opacity="0.12"/>
</svg>
