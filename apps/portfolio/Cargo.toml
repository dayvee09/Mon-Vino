[package]
name = "alpinecraft"
version = "0.1.0"
edition = "2021"
description = "AlpineCraft portfolio — lean web software, built with AI"
license = "MIT"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
